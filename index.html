<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub — Molodco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --accent: #ffde59;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        /* Светлая тема (Мягкая и свежая) */
        body.light-theme {
            --bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --accent: #6c5ce7;
            --glass: rgba(255, 255, 255, 0.4);
            --border: rgba(255, 255, 255, 0.5);
            --text: #2d3436;
            --shadow: rgba(31, 38, 135, 0.1);
        }

        /* Тема "Головоломка" (Красочная и неоновая) */
        body.inside-out-theme {
            --bg: fixed, 
                  radial-gradient(circle at 10% 20%, rgba(255, 222, 89, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 10%, rgba(255, 77, 77, 0.2) 0%, transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(126, 217, 87, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 90%, rgba(82, 113, 255, 0.2) 0%, transparent 40%),
                  linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            --accent: #00f2fe;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --shadow: rgba(0, 242, 254, 0.2);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container { width: 100%; max-width: 440px; }

        .theme-switcher {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 35px;
            background: var(--glass);
            padding: 6px;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .theme-switcher button {
            border: none;
            padding: 12px 5px;
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .theme-switcher button.active {
            background: var(--text);
            color: #1a1a2e; /* Цвет текста кнопки инвертируется */
            box-shadow: 0 4px 12px var(--shadow);
        }

        h1 {
            font-weight: 900;
            font-size: 36px;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        ul { list-style: none; padding: 0; }
        li { margin-bottom: 15px; }

        a.nav-btn {
            display: block;
            padding: 22px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text);
            text-decoration: none;
            font-weight: 800;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 8px 32px var(--shadow);
        }

        a.nav-btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.15);
        }

        .note { text-align: center; margin-top: 40px; font-size: 10px; opacity: 0.6; letter-spacing: 3px; font-weight: 700; }
    </style>
</head>
<body class="dark-theme">

    <div class="container">
        <h1>Головоломка</h1>

        <div class="theme-switcher">
            <button onclick="setTheme('dark')" id="btn-dark" class="active">Dark</button>
            <button onclick="setTheme('light')" id="btn-light">Light</button>
            <button onclick="setTheme('inside')" id="btn-inside">Inside Out</button>
        </div>

        <ul>
            <li><a href="schedule-dark.html" id="schedule-link" class="nav-btn">📅 РАСПИСАНИЕ ДНЯ</a></li>
            <li><a href="bible-lesson.html" class="nav-btn">📖 УРОК ДНЯ</a></li>
            <li><a href="organizers.html" class="nav-btn">👥 ОРГАНИЗАТОРЫ</a></li>
            <li><a href="rules.html" class="nav-btn">📜 ПРАВИЛА СОБЫТИЯ</a></li>
        </ul>

        <p class="note">MOLODCO • YOUTH CENTRAL</p>
    </div>

    <script>
        function setTheme(theme) {
            const body = document.body;
            const link = document.getElementById('schedule-link');
            const btns = document.querySelectorAll('.theme-switcher button');
            
            btns.forEach(b => b.classList.remove('active'));
            body.classList.remove('light-theme', 'inside-out-theme');

            if (theme === 'dark') {
                document.getElementById('btn-dark').classList.add('active');
                link.href = 'schedule-dark.html';
            } else if (theme === 'light') {
                body.classList.add('light-theme');
                document.getElementById('btn-light').classList.add('active');
                link.href = 'schedule-light.html';
            } else if (theme === 'inside') {
                body.classList.add('inside-out-theme');
                document.getElementById('btn-inside').classList.add('active');
                link.href = 'schedule-light.html';
            }
        }
    </script>
</body>
</html>
