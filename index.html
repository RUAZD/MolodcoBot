<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub — Molodco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --accent: #ffde59;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --btn-text: #ffffff;
        }

        body.light-theme {
            --bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --accent: #5271ff;
            --glass: rgba(255, 255, 255, 0.3);
            --border: rgba(0, 0, 0, 0.1);
            --text: #1a1a2e;
            --btn-text: #1a1a2e;
        }

        body.inside-out-theme {
            --bg: fixed, 
                  radial-gradient(circle at 15% 15%, #ffde59 0%, transparent 35%),
                  radial-gradient(circle at 85% 15%, #ff4d4d 0%, transparent 35%),
                  radial-gradient(circle at 50% 50%, #7ed957 0%, transparent 40%),
                  radial-gradient(circle at 15% 85%, #5271ff 0%, transparent 35%),
                  radial-gradient(circle at 85% 85%, #a29bfe 0%, transparent 35%),
                  linear-gradient(135deg, #1e0b36 0%, #0a0a1a 100%);
            --accent: #00f2fe;
            --glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.3);
            --text: #ffffff;
            --btn-text: #ffffff;
        }

        body {
            margin: 0; padding: 60px 20px 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg); background-attachment: fixed;
            color: var(--text); display: flex; justify-content: center;
            min-height: 100vh; transition: all 0.4s ease;
        }

        .container { width: 100%; max-width: 440px; }

        /* Маленький переключатель в углу */
        .theme-switcher {
            position: fixed; top: 15px; right: 15px;
            display: flex; gap: 4px;
            background: var(--glass); padding: 4px;
            border-radius: 12px; border: 1px solid var(--border);
            backdrop-filter: blur(10px); z-index: 1000;
        }

        .theme-switcher button {
            border: none; padding: 6px 10px; border-radius: 8px;
            background: transparent; color: var(--btn-text);
            cursor: pointer; font-size: 10px; font-weight: 800;
            text-transform: uppercase; transition: 0.3s;
        }

        .theme-switcher button.active { background: var(--text); color: #000; }
        body.light-theme .theme-switcher button.active { background: #1a1a2e; color: #fff; }

        h1 { font-weight: 900; font-size: 34px; text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 12px; }

        a.nav-btn {
            display: block; padding: 22px; background: var(--glass);
            border: 1px solid var(--border); border-radius: 20px;
            color: var(--text); text-decoration: none; font-weight: 800;
            backdrop-filter: blur(15px); text-align: center;
            transition: 0.3s;
        }

        .note { text-align: center; margin-top: 30px; font-size: 10px; opacity: 0.6; font-weight: 900; }
    </style>
</head>
<body>

    <div class="theme-switcher">
        <button onclick="setTheme('dark')" id="btn-dark">D</button>
        <button onclick="setTheme('light')" id="btn-light">L</button>
        <button onclick="setTheme('inside')" id="btn-inside">IO</button>
    </div>

    <div class="container">
        <h1>ХАБ</h1>
        <ul>
            <li><a href="#" id="schedule-link" class="nav-btn">📅 РАСПИСАНИЕ</a></li>
            <li><a href="bible-lesson.html" class="nav-btn">📖 УРОК ДНЯ</a></li>
            <li><a href="organizers.html" class="nav-btn">👥 ОРГАНИЗАТОРЫ</a></li>
            <li><a href="rules.html" class="nav-btn">📜 ПРАВИЛА</a></li>
        </ul>
        <p class="note">MOLODCO • CENTRAL YOUTH</p>
    </div>

    <script>
        function setTheme(theme) {
            const body = document.body;
            const link = document.getElementById('schedule-link');
            const btns = document.querySelectorAll('.theme-switcher button');
            
            btns.forEach(b => b.classList.remove('active'));
            body.classList.remove('light-theme', 'inside-out-theme', 'dark-theme');

            if (theme === 'dark') {
                body.classList.add('dark-theme');
                document.getElementById('btn-dark').classList.add('active');
                link.href = 'schedule-dark.html';
            } else if (theme === 'light') {
                body.classList.add('light-theme');
                document.getElementById('btn-light').classList.add('active');
                link.href = 'schedule-light.html';
            } else if (theme === 'inside') {
                body.classList.add('inside-out-theme');
                document.getElementById('btn-inside').classList.add('active');
                link.href = 'schedule-light.html';
            }
            localStorage.setItem('selectedTheme', theme);
        }

        // При загрузке страницы
        const savedTheme = localStorage.getItem('selectedTheme') || 'dark';
        setTheme(savedTheme);
    </script>
</body>
</html>
