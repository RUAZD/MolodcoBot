<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Головоломка — Molodco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --accent: #58a6ff; /* Синий акцент для темной темы */
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --btn-text: #ffffff;
        }
        body.light-theme {
            --bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --accent: #5271ff;
            --glass: rgba(255, 255, 255, 0.3);
            --border: rgba(0, 0, 0, 0.1);
            --text: #1a1a2e;
            --btn-text: #1a1a2e;
        }
        body.inside-out-theme {
            --bg: fixed, radial-gradient(circle at 15% 15%, #ffde59 0%, transparent 35%),
                  radial-gradient(circle at 85% 15%, #ff4d4d 0%, transparent 35%),
                  radial-gradient(circle at 50% 50%, #7ed957 0%, transparent 40%),
                  radial-gradient(circle at 15% 85%, #5271ff 0%, transparent 35%),
                  radial-gradient(circle at 85% 85%, #a29bfe 0%, transparent 35%),
                  linear-gradient(135deg, #1e0b36 0%, #0a0a1a 100%);
            --accent: #00f2fe; 
            --glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.3); --text: #ffffff; --btn-text: #ffffff;
        }
        body {
            margin: 0; padding: 80px 20px 20px; font-family: 'Inter', sans-serif;
            background: var(--bg); background-attachment: fixed; color: var(--text);
            display: flex; justify-content: center; min-height: 100vh; transition: 0.4s;
        }
        .container { width: 100%; max-width: 440px; }
        
        .theme-switcher-wrapper { position: fixed; top: 15px; right: 15px; text-align: right; z-index: 1000; }
        .theme-label { font-size: 9px; font-weight: 900; text-transform: uppercase; margin-right: 5px; opacity: 0.7; letter-spacing: 1px; color: var(--btn-text); }
        .theme-switcher {
            display: inline-flex; gap: 4px; background: var(--glass); padding: 4px; 
            border-radius: 12px; border: 1px solid var(--border); backdrop-filter: blur(10px);
        }
        .theme-switcher button {
            border: none; padding: 8px 12px; border-radius: 8px; background: transparent;
            color: var(--btn-text); cursor: pointer; font-size: 10px; font-weight: 800;
        }
        .theme-switcher button.active { background: var(--text); color: #000; }
        body.light-theme .theme-switcher button.active { background: #1a1a2e; color: #fff; }

        h1 { font-weight: 900; font-size: 32px; text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: -1px; }
        
        ul { list-style: none; padding: 0; margin-bottom: 30px; }
        li { margin-bottom: 12px; }
        a.nav-btn {
            display: block; padding: 18px; background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text); text-decoration: none; font-weight: 800;
            backdrop-filter: blur(15px); text-align: center; transition: 0.3s; font-size: 15px;
        }
        a.nav-btn:hover { transform: translateY(-3px); border-color: var(--accent); }

        .tg-section { display: flex; flex-direction: column; gap: 10px; }
        .tg-card {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background: rgba(0, 136, 204, 0.08); border: 1px solid rgba(0, 136, 204, 0.2);
            border-radius: 18px; color: var(--text); text-decoration: none; transition: 0.3s;
        }
        .tg-card:hover { background: rgba(0, 136, 204, 0.15); transform: scale(1.02); border-color: var(--accent); }
        .tg-icon { font-size: 24px; }
        .tg-info span { display: block; font-size: 10px; opacity: 0.6; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .tg-info strong { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }

        .note { text-align: center; margin-top: 40px; font-size: 10px; opacity: 0.6; letter-spacing: 4px; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="theme-switcher-wrapper">
        <span class="theme-label">Тема</span>
        <div class="theme-switcher">
            <button onclick="updateTheme('dark')" id="btn-dark">D</button>
            <button onclick="updateTheme('light')" id="btn-light">L</button>
            <button onclick="updateTheme('inside')" id="btn-inside">Г</button>
        </div>
    </div>

    <div class="container">
        <h1>ГОЛОВОЛОМКА</h1>
        <ul>
            <li><a href="#" id="schedule-link" class="nav-btn">📅 РАСПИСАНИЕ</a></li>
            <li><a href="bible-lesson.html" class="nav-btn">📖 УРОК ДНЯ</a></li>
            <li><a href="organizers.html" class="nav-btn">👥 ОРГАНИЗАТОРЫ</a></li>
            <li><a href="rules.html" class="nav-btn">📜 ПРАВИЛА</a></li>
            <li><a href="https://forms.yandex.ru/u/695a3d0b068ff05dc8f0030c" target="_blank" class="nav-btn">📝 ЖАЛОБНИК</a></li>
        </ul>

        <div class="tg-section">
            <a href="https://t.me/+NNrvf03EvVpiNDBi" class="tg-card">
                <div class="tg-icon">💬</div>
                <div class="tg-info">
                    <strong>Ссылка на беседу</strong>
                </div>
            </a>
            <a href="https://t.me/MolodcoBot" class="tg-card">
                <div class="tg-icon">🤖</div>
                <div class="tg-info">
                    <strong>Ссылка на бота</strong>
                </div>
            </a>
        </div>

        <p class="note">MOLODCO • CENTRAL YOUTH</p>
    </div>

    <script>
        function updateTheme(theme) {
            document.body.classList.remove('light-theme', 'inside-out-theme', 'dark-theme');
            document.querySelectorAll('.theme-switcher button').forEach(b => b.classList.remove('active'));
            const link = document.getElementById('schedule-link');
            
            if (theme === 'light') { 
                document.body.classList.add('light-theme'); 
                link.href = 'schedule-light.html'; 
            }
            else if (theme === 'inside') { 
                document.body.classList.add('inside-out-theme'); 
                link.href = 'schedule-light.html'; 
            }
            else { 
                document.body.classList.add('dark-theme');
                link.href = 'schedule-dark.html'; 
            }
            
            document.getElementById('btn-' + theme).classList.add('active');
            localStorage.setItem('selectedTheme', theme);
        }
        updateTheme(localStorage.getItem('selectedTheme') || 'dark');
    </script>
</body>
</html>
