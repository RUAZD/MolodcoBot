<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Урок дня</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 30px 20px;
            font-family: 'Inter', sans-serif;
            background: #05070a; color: #fff;
            display: flex; flex-direction: column; align-items: center;
        }
        .back { align-self: flex-start; margin-bottom: 20px; }
        .back a { color: #888; text-decoration: none; font-size: 14px; }
        .container { max-width: 600px; width: 100%; }
        h1 { font-weight: 900; background: linear-gradient(90deg, #ffde59, #ff914d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; border-radius: 24px;
            line-height: 1.8; backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .ref { color: #ffde59; font-weight: 700; margin-bottom: 10px; display: block; font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back"><a href="index.html">← НАЗАД</a></div>
        <h1>Урок дня</h1>
        <div class="card">
            <span class="ref">МЫСЛЬ НА СЕГОДНЯ:</span>
            <p>Здесь будет ваш текст. Используйте этот блок для вдохновения. Вы можете обновлять его через GitHub, и дизайн автоматически подстроится под объем текста.</p>
        </div>
    </div>
</body>
</html>
