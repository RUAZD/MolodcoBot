<!DOCTYPE html>
<html lang="ru">
<head>

        }
        body {

            padding: 32px;

            background: #0d1117;
            color: #c9d1d9;
            max-width: 800px;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 16px;

        }
        .ref {
            font-size: 13px;

        }

    <div class="back">
        <a href="index.html">← Назад к хабу</a>

    <div class="card">
        <div class="ref">Текст урока:</div>
        <p>
            Здесь можно размещать текст урока дня.

</html>
