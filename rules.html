<!DOCTYPE html>
<html lang="ru">
<head>

    <div class="container">

                <li>Уважать друг друга и команду.</li>
                <li>Соблюдать тайминг мероприятий.</li>
                <li>Беречь оборудование и пространство.</li>
                <li>Быть открытым к новым знаниям.</li>
            </ol>
        </div>
