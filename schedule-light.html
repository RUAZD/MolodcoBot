<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Расписание — Светлая тема</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --accent-light: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1c2541 0%, #05070a 100%); 
            color: #fff; 
            min-height: 100vh;
        }
        header { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 30px; 
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .back-btn { 
            text-decoration: none; 
            color: #fff; 
            background: var(--glass); 
            backdrop-filter: blur(10px);
            padding: 10px 18px; 
            border-radius: 14px; 
            font-size: 14px; 
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }
        h1 { 
            font-size: 20px; 
            font-weight: 900; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .images { 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        .img-container {
            position: relative;
            line-height: 0;
        }
        img { 
            width: 100%; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
            transition: transform 0.3s ease;
        }
        img:hover {
            transform: scale(1.01);
        }
        .note-light {
            font-size: 11px;
            color: #5271ff;
            text-align: center;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <a class="back-btn" href="index.html">←</a>
        <h1>РАСПИСАНИЕ (LIGHT)</h1>
    </header>

    <div class="images">
        <div class="img-container"><img src="images/Day_4_While_v1.jpg" alt="Day 4"></div>
        <div class="img-container"><img src="images/Day_5_While_v1.jpg" alt="Day 5"></div>
        <div class="img-container"><img src="images/Day_6_While_v1.jpg" alt="Day 6"></div>
        <div class="img-container"><img src="images/Day_7_While_v1.jpg" alt="Day 7"></div>
        <div class="img-container"><img src="images/Day_8_While_v1.jpg" alt="Day 8"></div>
    </div>

    <p class="note-light">Светлая версия графики</p>

</body>
</html>
